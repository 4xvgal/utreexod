# bob: upstream utreexod v0.6.0 + florestad-style split of the block and proof
# peers (lab branch lab/bob-floresta-0.6.0). Blocks come from bitcoind, utreexo
# proofs from the pruned proof-only bridge (alice, cw_utreexod_eh_rc).
#
#   docker compose -p cw-rc -f poc/docker-compose.regtest-eh.yml \
#     -f poc/docker-compose.regtest-prune.yml \
#     -f poc/docker-compose.regtest-bob.yml up -d bob
services:
  bob:
    image: cw-utreexod-bobfloresta-lab:poc
    container_name: cw_utreexod_bob_floresta
    network_mode: "service:bitcoind"
    depends_on:
      bitcoind:
        condition: service_healthy
      utreexod:
        condition: service_started
    command:
      - --regtest
      - --datadir=/data
      - --debuglevel=debug
      - --rpcuser=coconut
      - --rpcpass=coconut
      - --rpclisten=0.0.0.0:18336
      - --listen=0.0.0.0:18335
      - --connect=127.0.0.1:18444
      - --connect=127.0.0.1:18333
    volumes:
      - utreexod_bob_floresta_data:/data
    stop_grace_period: 2m

volumes:
  utreexod_bob_floresta_data:
    name: cw_utreexod_bob_floresta_data
